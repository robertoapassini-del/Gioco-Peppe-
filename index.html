<style>
/* Layout: one-screen console stacked like a cath-lab monitor wall — fluoro image, ECG strip, readouts, then a pedal-style control deck. Single dark look on purpose (sale angiografiche al buio). */
:root {
  --bg: #0b0d0f;
  --panel: #14181b;
  --line: #262d31;
  --fg: #d9e0dc;
  --muted: #7f8b86;
  --ecg: #4fe08a;
  --amber: #f2b33d;
  --red: #ff5a4e;
  --btn: #1c2226;
  --btn-on: #2b3a33;
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  margin: 0; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
#app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-block: 6px; box-sizing: border-box;
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
header h1 { white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
header span { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menuBtn { min-height: 30px; font-size: 13px; padding: 2px 10px; }
.fine { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fine button { font-family: var(--mono); font-size: 14px; padding: 2px; }
#screen { position: relative; width: min(100%, calc(100vh - 340px)); width: min(100%, calc(100dvh - 340px)); min-width: 200px; aspect-ratio: 1 / 1; max-width: 100%; margin: 0 auto; border-radius: 6px; overflow: hidden; background: #000; }
#fluoro { width: 100%; height: 100%; display: block; }
#app.rows3 #screen { width: min(100%, calc(100vh - 385px)); width: min(100%, calc(100dvh - 385px)); }
#app.rows3 #controls button { min-height: 46px; }
#ecg { width: 100%; height: 46px; display: block; background: #050807; border-radius: 4px; }
.readouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.readouts div { background: var(--panel); border-radius: 4px; padding: 3px 6px; }
.readouts small { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.readouts b { font-size: 14px; font-weight: 600; }
#msg { flex-shrink: 0; background: var(--panel); border-left: 3px solid var(--ecg); border-radius: 4px; padding: 6px 8px; font-size: 13px; line-height: 1.35; min-height: 36px; }
#msg.warn { border-left-color: var(--amber); }
#msg.bad { border-left-color: var(--red); }
#msg b { font-family: var(--display); letter-spacing: .05em; text-transform: uppercase; font-size: 14px; }
#gauge { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; }
#gauge .bar { flex: 1; height: 14px; border-radius: 3px; position: relative; overflow: hidden;
  background: linear-gradient(90deg, #22302a 0 40%, #2d4a33 40% 53%, #3d6b3f 53% 70%, #5c5222 70% 80%, #5c2622 80% 100%); }
#gauge .fill { position: absolute; inset: 0 auto 0 0; background: rgba(240,240,230,.55); width: 0; }
#controls { flex-shrink: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
button {
  font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 8px;
  min-height: 54px; padding: 4px; touch-action: none; cursor: pointer;
}
button small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--muted); }
button.held { background: var(--btn-on); border-color: var(--ecg); }
button:disabled { opacity: .35; }
button.primary { border-color: var(--ecg); color: var(--ecg); }
button.danger { border-color: var(--amber); color: var(--amber); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.wide2 { grid-column: span 2; }
.wide3 { grid-column: span 3; }
#overlay { position: fixed; inset: 0; background: rgba(5,7,8,.94); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 5;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-family: var(--display); font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .03em; text-wrap: balance; }
.card h3 { font-family: var(--display); font-size: 18px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--ecg); }
.card p { margin: 0; line-height: 1.45; font-size: 14px; }
.card .eyebrow { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.case { text-align: left; display: grid; gap: 2px; padding: 10px 12px; min-height: 0; text-transform: none; }
.case strong { font-family: var(--display); font-size: 19px; text-transform: uppercase; }
.case span { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; line-height: 1.35; }
.case em { font-family: var(--mono); font-style: normal; font-size: 11px; color: var(--amber); font-weight: 400; }
.how { font-size: 13px; color: var(--muted); line-height: 1.45; display: grid; gap: 4px; }
.how b { color: var(--fg); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { min-height: 42px; min-width: 62px; font-family: var(--mono); font-size: 14px; }
.choices button.sel { border-color: var(--ecg); color: var(--ecg); background: var(--btn-on); }
.qca { font-family: var(--mono); font-size: 13px; background: var(--panel); border-radius: 6px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-variant-numeric: tabular-nums; }
.qca span:nth-child(odd) { color: var(--muted); }
.report { font-family: var(--mono); font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; background: var(--panel); padding: 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.report span:nth-child(odd) { color: var(--muted); }
.score { font-family: var(--display); font-size: 64px; line-height: .9; color: var(--ecg); }
.score small { font-size: 22px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<div id="app">

</div>

<script>
"use strict";
// ---------- costanti ----------
const MM = 5;                 // unità mondo per millimetro
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

// ---------- anatomie ----------
const LEFT = {
  view: { x: 230, y: 270, w: 660 },
  spineX: 720,
  cat: [[240,1000],[255,880],[282,720],[318,560],[356,445],[396,377],[424,352],[444,345]],
  vessels: [
    { id:'TC',  name:'Tronco comune', root:true, rel:[[0,0],[36,2],[72,10]], d:[4.6,4.3] },
    { id:'IVA', name:'IVA', parent:'TC', at:1, rel:[[35,20],[85,65],[130,125],[170,205],[200,295],[220,385],[230,475],[233,545]], d:[3.5,1.6] },
    { id:'CX',  name:'Circonflessa', parent:'TC', at:1, rel:[[5,45],[-5,115],[-25,205],[-50,295],[-72,375]], d:[3.3,1.9] },
    { id:'S1',  name:'Settale', parent:'IVA', at:0.20, rel:[[-28,40],[-48,100],[-58,150]], d:[1.5,1.0] },
    { id:'D1',  name:'Diagonale 1', parent:'IVA', at:0.29, rel:[[55,12],[110,55],[155,115],[185,185]], d:[2.5,1.4] },
    { id:'D2',  name:'Diagonale 2', parent:'IVA', at:0.58, rel:[[48,18],[92,62],[120,120]], d:[2.0,1.2] },
    { id:'OM1', name:'Marginale 1', parent:'CX', at:0.30, rel:[[-45,28],[-85,85],[-105,150],[-112,215]], d:[2.8,1.6] },
    { id:'OM2', name:'Marginale 2', parent:'CX', at:0.66, rel:[[-38,30],[-62,90],[-70,140]], d:[2.1,1.3] },
  ]
};
const RIGHT = {
  view: { x: 140, y: 250, w: 640 },
  spineX: 600,
  cat: [[560,1000],[552,860],[532,680],[505,520],[478,430],[455,385],[436,366]],
  vessels: [
    { id:'CDX', name:'Coronaria destra', root:true, rel:[[0,0],[-35,15],[-80,60],[-120,130],[-145,220],[-150,310],[-130,390],[-85,455],[-20,495],[60,510],[130,508]], d:[4.0,2.4] },
    { id:'CON', name:'Ramo del cono', parent:'CDX', at:0.04, rel:[[-30,-30],[-70,-52],[-112,-60]], d:[1.6,1.0] },
    { id:'VD1', name:'Ramo ventricolare dx', parent:'CDX', at:0.40, rel:[[-48,8],[-96,28],[-136,58]], d:[1.8,1.1] },
    { id:'MA',  name:'Marginale acuto', parent:'CDX', at:0.60, rel:[[-48,22],[-88,60],[-110,105]], d:[2.0,1.2] },
    { id:'IVP', name:'Interventricolare post.', parent:'CDX', at:0.86, rel:[[8,42],[26,100],[52,160]], d:[2.3,1.3] },
  ]
};
const CASES = [
  { key:'iva', title:'Caso 1 · IVA media', anat: LEFT, cat:'EBU 3.5 6F', proj:'OAD 30° · CRA 30°',
    story:'Uomo, 61 anni. Angina da sforzo, scintigrafia positiva in sede anteriore. Stenosi critica dell\'IVA media fra prima e seconda diagonale.',
    target:'IVA', lesion:{ at:0.43, lenMm:15, sev:0.86 }, diff:'Facile' },
  { key:'om', title:'Caso 2 · Marginale', anat: LEFT, cat:'EBU 3.5 6F', proj:'OAD 20° · CAU 25°',
    story:'Donna, 68 anni, diabetica. NSTEMI, troponina in salita. Lesione subocclusiva del primo ramo marginale.',
    target:'OM1', lesion:{ at:0.38, lenMm:12, sev:0.9 }, diff:'Media' },
  { key:'cdx', title:'Caso 3 · Coronaria destra', anat: RIGHT, cat:'JR 4 6F', proj:'OAS 40°',
    story:'Uomo, 57 anni, fumatore. Angina instabile. Stenosi lunga della coronaria destra prossimale-media.',
    target:'CDX', lesion:{ at:0.31, lenMm:20, sev:0.84 }, diff:'Difficile' },
  { key:'bif', title:'Caso 4 · Biforcazione', anat: LEFT, cat:'EBU 3.5 6F', proj:'OAS 40° · CRA 25°',
    story:'Uomo, 66 anni. Angina stabile nonostante la terapia. Biforcazione IVA–prima diagonale, Medina 1,1,1: stent provvisorio sull\'IVA e kissing balloon.',
    target:'IVA', lesion:{ branch:'D1', lenMm:16, sev:0.82 }, side:{ id:'D1', lenMm:6, sev:0.6 }, diff:'Esperto', bif:true,
    contrastOk: 112, fluoroOk: 200 },
];

// ---------- geometria ----------
function catmull(pts, step) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const n = Math.max(2, Math.ceil(Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) / step));
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t*t, t3 = t2*t;
      const f = (a,b,c,d) => 0.5*((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
      out.push([f(p0[0],p1[0],p2[0],p3[0]), f(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
  out.push(pts[pts.length-1].slice());
  return out;
}
function makePath(pts, extra) {
  const p = catmull(pts, 2), cum = [0];
  for (let i = 1; i < p.length; i++) cum.push(cum[i-1] + Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]));
  return Object.assign({ p, cum, len: cum[cum.length-1], children: [] }, extra);
}
function rawAt(v, s) {
  s = Math.max(0, Math.min(v.len, s));
  let lo = 0, hi = v.cum.length - 1;
  while (hi - lo > 1) { const m = (lo+hi) >> 1; if (v.cum[m] <= s) lo = m; else hi = m; }
  const seg = v.cum[hi] - v.cum[lo] || 1, t = (s - v.cum[lo]) / seg;
  return [v.p[lo][0] + (v.p[hi][0]-v.p[lo][0])*t, v.p[lo][1] + (v.p[hi][1]-v.p[lo][1])*t];
}
function tanAt(v, s) {
  const a = rawAt(v, s - 4), b = rawAt(v, s + 4), l = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1;
  return [(b[0]-a[0])/l, (b[1]-a[1])/l];
}
function buildAnatomy(A) {
  const cat = makePath(A.cat, { id:'cat', isCat:true, d0:2, d1:2 });
  const ost = A.cat[A.cat.length-1];
  const map = {};
  for (const def of A.vessels) {
    let start, parent = null, at = 0;
    if (def.root) { start = ost; parent = cat; at = cat.len; }
    else { parent = map[def.parent]; at = def.at >= 1 ? parent.len : def.at * parent.len; start = rawAt(parent, at); }
    const pts = def.rel.map(r => [start[0] + r[0], start[1] + r[1]]);
    if (def.rel[0][0] !== 0 || def.rel[0][1] !== 0) pts.unshift(start.slice());
    const v = makePath(pts, { id:def.id, name:def.name, d0:def.d[0], d1:def.d[1], parent, at });
    const t = tanAt(parent, Math.min(at, parent.len - 4)), c = tanAt(v, 10);
    v.angle = Math.atan2(t[0]*c[1] - t[1]*c[0], t[0]*c[0] + t[1]*c[1]);
    parent.children.push(v);
    map[def.id] = v;
  }
  for (const k in map) map[k].children.sort((a,b) => a.at - b.at);
  cat.children.sort((a,b) => a.at - b.at);
  return { cat, map, list: Object.values(map) };
}

// ---------- stato ----------
let G = null;          // anatomia corrente
let S = null;          // stato partita
let C = null;          // caso
const held = {};
let fluoroCtx, ecgCtx, W = 0, H = 0, DPR = 1, bgCanvas = null, contrastLayer = null, noise = [];

function newGame(ci) {
  C = CASES[ci];
  G = buildAnatomy(C.anat);
  const tgt = G.map[C.target];
  const c = C.lesion.branch ? G.map[C.lesion.branch].at + 2 * MM : C.lesion.at * tgt.len, L = C.lesion.lenMm * MM;
  const sbL = C.side ? C.side.lenMm * MM : 0;
  S = {
    phase: 'guida', t: 0, route: [{ v: G.cat, off: 0 }], T: G.cat.len - 30, tipSign: -1,
    push: 0, contrastMl: 0, fluoroS: 0, inj: null, injCount: 0, finalInj: false,
    heart: 0, noiseI: 0, fluoroOn: false,
    lesion: { c, a: c - L/2, b: c + L/2, L, sev: C.lesion.sev, sev0: C.lesion.sev },
    stent: null, predil: null, dissection: false, blockedMsg: false, pressure: 0, maxP: 0, inflating: false, inflT: 0, deployed: null,
    complication: null, st: 0, hr: 68, wireDone: false, rotations: 0, msgT: 0, extravasation: 0,
    wires: [{}], aw: 0,
    sb: C.side ? { id: C.side.id, L: sbL, sev: C.side.sev, sev0: C.side.sev } : null,
    sbJailed: false, sbProtected: false, sbRecrossed: false, sbDone: false, kiss: null, kissDone: null,
  };
  $('caseLabel').textContent = C.title;
  resize();
  setPhase('guida');
  hideOverlay();
}

// ---------- percorso guida ----------
function entryAt(T, r = S.route) {
  let e = r[0];
  for (const x of r) if (x.off <= T) e = x;
  return e;
}
function routeRaw(T, r = S.route) { const e = entryAt(T, r); return rawAt(e.v, T - e.off); }
function heartOff() {
  const ph = S.heart * TAU;
  return [7*Math.sin(ph) + 2*Math.sin(2*ph), 5*Math.sin(ph + 1.1)];
}
function disp(v, p) {
  const o = heartOff();
  const w = v.isCat ? 0 : 1;
  return [p[0] + o[0]*w, p[1] + o[1]*w];
}
function routeP(T, r = S.route) {
  const e = entryAt(T, r), s = T - e.off, p = rawAt(e.v, s), o = heartOff();
  const w = e.v.isCat ? Math.max(0, (s - (e.v.len - 160)) / 160) : 1;
  return [p[0] + o[0]*w, p[1] + o[1]*w];
}
function routeTan(T, r = S.route) { const a = routeRaw(T - 4, r), b = routeRaw(T + 4, r), l = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1; return [(b[0]-a[0])/l, (b[1]-a[1])/l]; }
function tipEntry() { return S.route[S.route.length - 1]; }
function targetEntry() { return S.route.find(e => e.v.id === C.target); }
// più guide: S.route/S.T/S.tipSign sono sempre quelle della guida attiva
function getWire(i) { return i === S.aw ? { route: S.route, T: S.T, tipSign: S.tipSign } : S.wires[i]; }
function saveWire() { S.wires[S.aw] = { route: S.route, T: S.T, tipSign: S.tipSign }; }
function loadWire(i) {
  if (i === S.aw) return;
  saveWire(); S.aw = i;
  if (!S.wires[i] || !S.wires[i].route) S.wires[i] = { route: [{ v: G.cat, off: 0 }], T: G.cat.len - 30, tipSign: -1 };
  const w = S.wires[i]; S.route = w.route; S.T = w.T; S.tipSign = w.tipSign; S.push = 0;
  const b = $('bWire'); if (b) b.innerHTML = wireLabel();
}
function wireLabel() { return `Guida ${S.aw + 1} ⇄<small>passa alla ${S.aw ? 1 : 2}</small>`; }
function sbWireOk() {
  if (!S.sb || S.wires.length < 2 && S.aw === 0) return false;
  const w = getWire(1); if (!w || !w.route) return false;
  const se = w.route.find(e => e.v.id === S.sb.id);
  return !!se && w.T > se.off + 12 * MM && !S.sbJailed;
}

function moveWire(dir, dt) {
  const top = tipEntry();
  let speed = 70;                  // ~14 mm/s
  const te = targetEntry();
  if (te && top === te) {
    const s = S.T - te.off;
    if (s > S.lesion.a - 5 && s < S.lesion.b + 5 && dir > 0) speed *= 0.35;   // resistenza della placca
  }
  const oldT = S.T;
  let newT = S.T + dir * speed * dt;
  if (dir < 0) {
    newT = Math.max(G.cat.len * 0.55, newT);
    while (S.route.length > 1 && newT < tipEntry().off) {
      const gone = S.route.pop();
      if (S.sb && gone.v.id === S.sb.id && S.aw === 1 && S.sbJailed) {
        S.sbJailed = false;
        flash('Guida 2 fuori dal ramo laterale. Ora ripassala nella diagonale <b>attraverso le maglie</b> dello stent.');
      }
    }
    S.T = newT; S.push = 0; return;
  }
  const s0 = oldT - top.off, s1 = newT - top.off, v = top.v;
  // biforcazioni attraversate
  const crossed = v.children.filter(ch => ch.at > s0 && ch.at <= s1 + 0.001);
  if (crossed.length) {
    const at = crossed[0].at;
    const group = v.children.filter(ch => Math.abs(ch.at - at) < 2);
    const endsHere = at >= v.len - 1;
    const want = S.tipSign * 0.8;
    let best = endsHere ? null : 'main', bestD = endsHere ? 1e9 : Math.abs(0 - want);
    for (const ch of group) { const d = Math.abs(ch.angle - want); if (d < bestD) { bestD = d; best = ch; } }
    if (best !== 'main') {
      S.route.push({ v: best, off: top.off + at });
      if (S.sb && best.id === S.sb.id && S.aw === 1 && S.deployed && !S.sbJailed && !S.sbRecrossed && !S.kissDone) {
        S.sbRecrossed = true;
        flash('<b>Ramo laterale ricrossato</b> attraverso le maglie dello stent. Ora puoi fare il kissing balloon.');
        return;
      }
      S.T = newT; S.push = 0;

function crossBlocked() { return S.stent.kind === 'stent' && !S.predil && S.lesion.sev > 0.7; }

function evaluate() {

  const add = (name, pts, max, val) => { r.parts.push([name, val, pts, max]); r.total += pts; };

    const side = m => m < 0 ? Math.max(0, 7 + m * 4) : m <= 5 ? 15 : Math.max(9, 15 - (m - 5) * 1.5);
    add('Copertura prossimale', Math.round(side(mp)), 15, mp.toFixed(1) + ' mm');
    add('Copertura distale', Math.round(side(md)), 15, md.toFixed(1) + ' mm');
    if (mp < 0 || md < 0) r.notes.push('Geographic miss: parte della placca è rimasta fuori dallo stent.');
    const dd = Math.abs(st.d - q.ref);
    add('Diametro stent', dd <= 0.25 ? 10 : dd <= 0.5 ? 6 : 2, 10, st.d.toFixed(2) + ' / rif ' + q.ref.toFixed(2));
    if (st.d - q.ref > 0.5) r.notes.push('Stent sovradimensionato: rischio di dissezione.');
    if (q.ref - st.d > 0.5) r.notes.push('Stent sottodimensionato: rischio di malapposizione.');

    add('Lunghezza stent', ok ? 7 : st.Lmm >= q.len ? 4 : 2, 7, st.Lmm + ' mm');
    const p = D.p;
    add('Pressione di rilascio', p > 20 ? 0 : p >= 12 && p <= 18 ? 13 : p >= 10 ? 9 : p >= 8 ? 4 : 0, 13, S.deployed.post ? 'post NC 16 atm' : p.toFixed(0) + ' atm');
  }

  if (!P) add('Predilatazione', 0, 10, 'non eseguita');

    const pts = (P.ratio >= 0.75 && P.ratio <= 1.05 ? 5 : 2) + (P.cover >= 0.9 ? 3 : 1) + (P.p >= 6 && P.p <= 14 ? 2 : 0);
    add('Predilatazione', pts, 10, P.d.toFixed(1) + '×' + P.Lmm + ' · ' + P.p.toFixed(0) + ' atm');
  }

  }

    add('Protezione ramo laterale', S.sbProtected ? 5 : 0, 5, S.sbProtected ? 'guida in diagonale' : 'assente');
    const KD = S.kissDone;
    if (!KD) add('Kissing balloon', 0, 12, 'non eseguito');

      add('Kissing balloon', pts, 12, KD.dM.toFixed(2) + ' + ' + KD.dS.toFixed(1) + ' · ' + KD.p.toFixed(0) + ' atm');
      if (KD.diss) { r.total -= 8; r.notes.push('Dissezione dell\'ostio della diagonale durante il kissing (−8).'); }
    }

  const idx = CASES.indexOf(C);
  $('again').addEventListener('click', () => newGame(idx));
  $('menu').addEventListener('click', intro);
}

// ---------- overlay ----------
function showOverlay(html) { const o = $('overlay'); o.innerHTML = html; o.hidden = false; o.scrollTop = 0; }
function hideOverlay() { $('overlay').hidden = true; }
function intro() {
  let best = CASES.map(c => { try { return +localStorage.getItem('emo-best-' + c.key) || 0; } catch (_) { return 0; } });
  showOverlay(`
    <div class="card">
      <div class="eyebrow">Ospedale Papardo · Messina · Emodinamica</div>
      <h2>Angioplastica coronarica</h2>
      <p>Buongiorno Dr. Giuseppe. Accesso radiale destro già fatto, catetere guida ingaggiato. Il paziente è sul tavolo: tocca a te.</p>
      ${CASES.map((c, i) => `<button class="case" data-i="${i}"><strong>${c.title}</strong><span>${c.story}</span><em>${c.diff} · catetere ${c.cat}${best[i] ? ' · record ' + best[i] : ''}</em></button>`).join('')}
      <div class="how">
        <span><b>Contrasto</b> mostra le coronarie per un paio di secondi. Ogni iniezione costa 8 ml.</span>
        <span><b>Ruota</b> gira la punta curva della guida: alle biforcazioni la guida entra nel ramo verso cui punta.</span>
        <span><b>Avanza / Ritira</b> si tengono premuti. Il tempo di scopia corre solo mentre lavori.</span>
        <span><b>Biforcazione</b> due guide: lo stent schiaccia il ramo laterale, poi ripassi la guida 2 nelle maglie e fai il kissing.</span>
        <span><b>Pallone</b> predilata la placca: senza predilatazione lo stent non passa le stenosi più strette.</span>
        <span>Non spingere la guida contro il fondo di un vaso.</span>
      </div>
    </div>`);
  $('overlay').querySelectorAll('.case').forEach(b => b.addEventListener('click', () => newGame(+b.dataset.i)));
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && $('overlay').hidden) step(dt);
  if (S) { drawFluoro(); drawEcg(dt); }
  requestAnimationFrame(frame);
}
function step(dt) {
  S.t += dt;
  if (msgLock > 0) msgLock -= dt;
  const injActive = S.inj && S.t - S.inj.t0 < 3.2;
  let moving = false;
  if (S.phase === 'guida' || (S.phase === 'finale' && C.bif)) {
    if (held.fwd) { moveWire(1, dt); moving = true; }
    else if (held.back) { moveWire(-1, dt); moving = true; }
    else S.push = 0;
    const ok = wireOk();
    const bk = $('bKiss');
    if (bk) {
      const why = kissOk(), lab = S.kissDone ? 'eseguito' : why ? 'serve la guida 2' : 'pronto';
      bk.classList.toggle('primary', !why); bk.style.opacity = why ? '0.55' : '';
      const sm = bk.querySelector('small'); if (sm && sm.textContent !== lab) sm.textContent = lab;
    }
    if (S.sb && S.aw === 1 && !S.sbDone && sbWireOk()) { S.sbDone = true; if (!S.deployed) flash('<b>Guida 2 nella diagonale</b> ramo laterale protetto. Torna alla guida 1 o prosegui col pallone.'); }
    const b = $('bNext'); if (b) b.disabled = !ok;
    const bb = $('bBal'); if (bb) bb.disabled = !ok;
    if (ok && !S.wireDone) { S.wireDone = true; if (!S.predil) flash('<b>Guida oltre la lesione</b> in sede distale. Ora predilata col pallone.'); }
    if (!ok) S.wireDone = false;
  } else if (S.phase === 'stent') {
    const [lo, hi] = stentLimits();
    if (held.fwd) { S.stent.P = Math.min(hi, S.stent.P + 55 * dt); moving = true; }
    if (held.back) { S.stent.P = Math.max(lo, S.stent.P - 55 * dt); moving = true; }
    const te = targetEntry();
    const inCor = S.stent.P - S.stent.L / 2 > te.off - 40;
    if (held.fwd && crossBlocked() && S.stent.P >= hi - 1 && !S.blockedMsg) { S.blockedMsg = true; flash('<b>Lo stent non passa</b> la placca è troppo stretta. Ritira lo stent con <b>Cambia</b> e predilata col pallone.', 'warn'); }
    const b = $('bNext'); if (b) b.disabled = !inCor;
  } else if (S.phase === 'gonfia' || S.phase === 'kiss') {
    if (held.infl) {
      S.inflating = true; moving = true;
      S.pressure = Math.min(24, S.pressure + 3.2 * dt); S.maxP = Math.max(S.maxP, S.pressure); S.inflT += dt;
      if (S.pressure > spec().burst + 0.5) { held.infl = false; deflate(); }
    }
    $('gaugeFill').style.width = (S.pressure / 24 * 100) + '%';
    $('gaugeVal').textContent = S.pressure.toFixed(1) + ' atm';
    if (S.inflating && msgLock <= 0) {
      const k = spec();
      if (S.pressure > k.rbp) say('<b>Oltre la RBP</b> rischio di rottura del pallone!', 'bad');
      else if (S.pressure >= k.nom) say(S.phase === 'kiss' ? 'Pressione nominale: i due palloni si toccano nella biforcazione.' : S.stent.kind === 'balloon' ? 'Pressione nominale: il pallone è aperto, la placca cede.' : 'Pressione nominale raggiunta. Lo stent è espanso.');
      else if (S.inflT > 2) say('Il paziente riferisce dolore toracico durante l\'insufflazione.', 'warn');
    }
  }
  if (S.heartKick > 0) { S.heartKick -= dt; moving = true; }
  S.fluoroOn = moving || injActive;
  if (S.fluoroOn) { S.fluoroS += dt; S.heart += dt * S.hr / 60; S.noiseI = (S.noiseI + 1) % 4; }
  // ST e frequenza
  const ischemia = S.inflating ? Math.min(1, S.inflT / 6) : 0;
  S.st += ((ischemia * 0.45) - S.st) * Math.min(1, dt * (S.inflating ? 0.8 : 2));
  if (!S.inflating) S.inflT = Math.max(0, S.inflT - dt * 2);
  S.hr = 68 + Math.round(S.st * 18) + (S.extravasation ? 40 : 0);
  if (S.extravasation) S.extravasation = Math.min(2, S.extravasation + dt * 0.1);
  $('rContrast').textContent = S.contrastMl + ' ml';
  $('rFluoro').textContent = fmtTime(S.fluoroS);
  $('rHr').textContent = S.hr;
  $('rBp').textContent = S.extravasation ? '78/50' : (132 - Math.round(S.st * 20)) + '/' + (78 - Math.round(S.st * 8));
}

$('menuBtn').addEventListener('click', () => { if (S && S.inflating) return; intro(); });
window.addEventListener('resize', () => { if (S) resize(); });
document.addEventListener('gesturestart', e => e.preventDefault());
// partita dimostrativa dietro al menu iniziale
newGame(0);
intro();
requestAnimationFrame(frame);
</script>
